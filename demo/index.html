<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=http://127.0.0.1:5001/" />
    <title>Open Groundwork Flask Dashboard</title>
    <style>
      :root {
        --bg: #07111d;
        --panel: #0d1a2a;
        --line: #21364d;
        --text: #d8e5ef;
        --muted: #8092a6;
        --cyan: #2dd4bf;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 70% 0, rgba(45, 212, 191, 0.16), transparent 34%), var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(560px, calc(100vw - 32px));
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(13, 26, 42, 0.82);
        padding: 28px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.5;
      }

      a {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        border: 1px solid rgba(45, 212, 191, 0.7);
        border-radius: 8px;
        padding: 0 14px;
        color: var(--cyan);
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Groundwork runs through Flask now</h1>
      <p>
        This file redirects to the actual Flask dashboard. If you opened the old static file in Chrome,
        use the Flask URL instead so the top feature tabs and command-center styling load correctly.
      </p>
      <a href="http://127.0.0.1:5001/">Open Flask dashboard</a>
    </main>
  </body>
</html>
