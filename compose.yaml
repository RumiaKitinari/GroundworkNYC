services:
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: groundwork
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U groundwork -d groundwork]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    command: [redis-server, --maxmemory, 256mb, --maxmemory-policy, allkeys-lru]
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://groundwork:${POSTGRES_PASSWORD}@db:5432/groundwork
    command: [python, -m, groundwork_backend.cli, migrate]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://groundwork:${POSTGRES_PASSWORD}@db:5432/groundwork
      REDIS_URL: redis://redis:6379/0
      GROUNDWORK_SECRET_KEY: ${GROUNDWORK_SECRET_KEY:?Set GROUNDWORK_SECRET_KEY in .env}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./data:/app/data:ro
      - instance:/app/instance
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
volumes:
  postgres:
  instance:
